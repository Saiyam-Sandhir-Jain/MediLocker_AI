{% extends 'base.html' %}

{% block title %}MediLocker AI - Chatbot{% endblock %}

{% block content %}
<div class="flex justify-center items-center h-screen">
    <!-- Chatbot Container (3/4th of the screen) -->
    <div class="w-3/4 bg-white rounded-3xl shadow-lg overflow-hidden flex flex-col">
        <!-- Chatbot Header -->
        <header class="bg-[#0F1746] p-6">
            <h1 class="text-2xl font-bold text-white text-center">MediLocker AI Chatbot</h1>
        </header>

        <!-- Chatbot Messages (Scrollable Area) -->
        <main class="flex-grow-1 p-6 max-height-60vh overflow-y-auto" id="chat">
            <!-- Bot Introduction -->
            <div class="flex items-start mb-4">
                <div class="w-10 h-10 rounded-full bg-[#0F1746] flex items-center justify-center text-white font-bold">M</div>
                <div class="ml-4 bg-gray-200 p-4 rounded-lg max-w-[70%]">
                    <p class="text-sm font-semibold text-[#0F1746]">MediLocker AI</p>
                    <p class="text-gray-700">Hello, I'm MediLocker AI. I can help you analyze your symptoms and provide medical advice. Tap OK to continue!</p>
                </div>
            </div>
            <div id="messages" class="flex flex-col overflow-y-auto display-flex max-height-100% flex-direction-column"></div>
        </main>

        <!-- Chatbot Input Area -->
        <form class="border-t border-gray-200 p-4 flex items-center" id="chatForm">
            <input
                type="text"
                id="textInput"
                placeholder="Type your message..."
                class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0F1746]"
            />
            <i id="micIcon" class="mic-icon">🎤</i>
            <button
                type="submit"
                class="ml-2 bg-[#0F1746] text-white px-4 py-2 rounded-lg hover:bg-indigo-400 transition"
            >
                Send
            </button>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        $('#chatForm').on('submit', function(event) {
            event.preventDefault(); // Prevent the form from submitting the traditional way
    
            var userMessage = $('#textInput').val();
            $('#messages').append('<div class="flex items-start mb-4"><div class="w-10 h-10 rounded-full bg-[#0F1746] flex items-center justify-center text-white font-bold">Y</div><div class="ml-4 bg-gray-200 p-4 rounded-lg max-w-[70%]"><p class="text-sm font-semibold text-[#0F1746]">You</p><p class="text-gray-700">' + userMessage + '</p></div></div>');
            $('#textInput').val(''); // Clear the input field
    
            // Send the user's message to the backend
            $.ajax({
                url: '/chatbot/send/',  // Updated URL with /chatbot/ prefix
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ message: userMessage }),
                success: function(data) {
                    // Append the bot's response to the chat
                    $('#messages').append('<div class="flex items-start mb-4"><div class="w-10 h-10 rounded-full bg-[#0F1746] flex items-center justify-center text-white font-bold">M</div><div class="ml-4 bg-gray-200 p-4 rounded-lg max-w-[70%]"><p class="text-sm font-semibold text-[#0F1746]">MediLocker AI</p><p class="text-gray-700">' + data.response + '</p></div></div>');
                    $('#messages').scrollTop($('#messages')[0].scrollHeight); // Scroll to the bottom
                },
                error: function(xhr, status, error) {
                    console.error('Error:', error);
                    $('#messages').append('<div class="flex items-start mb-4"><div class="w-10 h-10 rounded-full bg-[#0F1746] flex items-center justify-center text-white font-bold">M</div><div class="ml-4 bg-gray-200 p-4 rounded-lg max-w-[70%]"><p class="text-sm font-semibold text-[#0F1746]">MediLocker AI</p><p class="text-gray-700">Sorry, something went wrong. Please try again.</p></div></div>');
                }
            });
        });
    });
</script>
{% endblock %}
